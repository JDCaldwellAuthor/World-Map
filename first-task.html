<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Task</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .question {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .input-group {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #764ba2;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #764ba2;
        }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            text-align: center;
            font-size: 16px;
        }
        .feedback.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .feedback.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .button-group {
            margin-top: 30px;
            text-align: center;
        }
        .return-btn {
            background-color: #28a745;
            padding: 12px 30px;
            font-size: 16px;
        }
        .return-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>First Task</h1>
        <div class="question">
            What is the language of origin of the text in question?
        </div>
        
        <div class="input-group">
            <input type="text" id="answerInput" placeholder="Enter your answer...">
            <button onclick="submitAnswer()">Submit</button>
        </div>
        
        <div id="feedback" class="feedback"></div>
        
        <div class="button-group">
            <button class="return-btn" onclick="returnToMap()">Return to the Realm</button>
        </div>
    </div>

    <script>
        function submitAnswer() {
            const answerInput = document.getElementById('answerInput');
            const feedback = document.getElementById('feedback');
            const answer = answerInput.value.trim().toLowerCase();

            if (answer === 'phrygian') {
                feedback.textContent = 'Yes...our other sources say, this must be the correct answer.';
                feedback.className = 'feedback correct';
            } else if (answer === '') {
                feedback.textContent = 'Please enter an answer.';
                feedback.className = 'feedback incorrect';
            } else {
                feedback.textContent = '...that does not appear to be correct, based on our research. Do you wish to try again?';
                feedback.className = 'feedback incorrect';
            }
        }

        function returnToMap() {
            window.location.href = 'index.html';
        }

        // Allow Enter key to submit
        document.getElementById('answerInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                submitAnswer();
            }
        });
    </script>
</body>
</html>
